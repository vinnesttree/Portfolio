services:
  portfolio:
    build: .
    image: portfolio:latest
    container_name: portfolio
    ports:
      - "${PORT:-8080}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Uncomment to edit site/content/*.json and see changes on refresh,
    # without rebuilding the image.
    # volumes:
    #   - ./site/content:/usr/share/nginx/html/content:ro
